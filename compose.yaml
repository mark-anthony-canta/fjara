services:
  frontend:
    build: ./frontend
    environment:
      BACKEND_URL: http://backend:8000
    ports:
      - "127.0.0.1:3000:3000"
    depends_on:
      - backend
  qdrant:
    image: qdrant/qdrant:v1.17.0
    ports:
      - "127.0.0.1:16333:6333"
    volumes:
      - qdrant_data:/qdrant/storage
  backend:
    build: ./backend
    env_file: .env
    environment:
      QDRANT_URL: http://qdrant:6333
    ports:
      - "127.0.0.1:8000:8000"
    depends_on:
      - qdrant
  ingest:
    build: ./backend
    profiles: [ingest]
    env_file: .env
    environment:
      QDRANT_URL: http://qdrant:6333
    volumes:
      - ./data:/app/data
    command: ["python", "-m", "app.ingest"]
    depends_on:
      - qdrant
volumes:
  qdrant_data:
